[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regen-grn"
version = "0.1.0"
description = "Minimal runnable implementation of REGEN for dynamic GRN reconstruction"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.scripts]
regen = "regen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
